<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>TR-YT Sampler Controller</title>
  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      --orange: #ff6600;
      --orange-hover: #ff8533;
      --green: #39ff14;
      --text: #e0e0e0;
      --border: #2a2a2a;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 940px; width: 100%; }
    h1 { color: var(--orange); text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    
    .yt-section { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .url-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="text"], input[type="number"], select {
      background: #000; border: 1px solid var(--orange); color: #fff; padding: 8px 12px; border-radius: 4px;
    }
    button {
      background: var(--orange); color: #000; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s;
    }
    button:hover { background: var(--orange-hover); }
    
    #player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; background: #000; }
    #player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .triggers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
    .trigger-card { background: #000; border: 1px solid var(--border); padding: 8px; border-radius: 4px; text-align: center; }
    .trigger-card label { display: block; color: var(--orange); font-weight: bold; margin-bottom: 4px; }
    .trigger-card input { width: 80%; text-align: center; margin-bottom: 5px; }
    .trigger-card button { font-size: 11px; padding: 4px 8px; width: 90%; }

    .seq-section { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .seq-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
    
    /* Panel parametrów dźwięku (Channel Strip) */
    .channel-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      background: #000;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      margin-bottom: 15px;
    }
    .strip-item { display: flex; flex-direction: column; gap: 4px; }
    .strip-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--orange); font-weight: bold; }
    .strip-label span:last-child { color: var(--green); }
    .channel-strip input[type="range"] { accent-color: var(--orange); cursor: pointer; width: 100%; }

    /* Siatka kroków z podziałem po 4 */
    .steps-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 6px; width: 100%; }
    .step-btn {
      min-height: 46px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.08s, background 0.1s;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    /* Grupa A: kroki 1-4 oraz 9-12 */
    .step-group-a { background: #323232; border: 1px solid #555; color: #aaa; }
    /* Grupa B: kroki 5-8 oraz 13-16 */
    .step-group-b { background: #181818; border: 1px solid #2d2d2d; color: #777; }

    .step-btn.active { background: var(--orange) !important; color: #000 !important; border-color: var(--orange-hover) !important; box-shadow: 0 0 10px var(--orange); }
    .step-btn.current { border-color: var(--green) !important; transform: scale(1.08); }
    .step-btn.active.current { background: var(--green) !important; color: #000 !important; box-shadow: 0 0 12px var(--green); }

    .preset-section { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; }
  </style>
</head>
<body>

<div class="container">
  <h1>TR-YT Controller</h1>

  <div class="yt-section">
    <div class="url-bar">
      <input type="text" id="yt-url" placeholder="Wklej link YouTube..." style="flex-grow: 1;">
      <button onclick="loadVideo()">Załaduj wideo</button>
    </div>
    
    <div id="player-wrapper">
      <div id="yt-player"></div>
    </div>

    <div class="triggers-grid" id="triggers-container"></div>
  </div>

  <div class="seq-section">
    <div class="seq-controls">
      <button id="play-seq-btn" onclick="toggleSequencer()">PLAY</button>
      <label>BPM: <input type="number" id="bpm-input" value="124" min="40" max="240" style="width: 55px;" onchange="updateBPM()"></label>
      <button onclick="tapTempo()">TAP</button>
      
      <label>Bank:
        <select id="bank-select" style="border-color: var(--green);">
          <option value="modern">Modern House / 909</option>
          <option value="808">TR-808 Vintage</option>
        </select>
      </label>

      <label style="margin-left:auto;">Ścieżka:
        <select id="inst-select" onchange="onInstrumentChange()">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hihat">Hi-Hat</option>
          <option value="lowtom">Low Tom</option>
          <option value="midtom">Mid Tom</option>
          <option value="hightom">High Tom</option>
          <option value="crash">Crash</option>
          <option value="ride">Ride</option>
          <option value="shaker">Shaker</option>
          <option value="clap">Clap</option>
        </select>
      </label>
    </div>

    <!-- Panel Kontroli Brzmienia (Channel Strip) -->
    <div class="channel-strip">
      <div class="strip-item">
        <div class="strip-label"><span>PITCH</span><span id="disp-tune">0 st</span></div>
        <input type="range" id="param-tune" min="-12" max="12" value="0" step="1" oninput="setParam('tune', this.value)">
      </div>
      <div class="strip-item">
        <div class="strip-label"><span>CUTOFF</span><span id="disp-cutoff">20 kHz</span></div>
        <input type="range" id="param-cutoff" min="200" max="20000" value="20000" step="100" oninput="setParam('cutoff', this.value)">
      </div>
      <div class="strip-item">
        <div class="strip-label"><span>RESONANCE</span><span id="disp-res">0.0</span></div>
        <input type="range" id="param-res" min="0" max="18" value="0" step="0.5" oninput="setParam('res', this.value)">
      </div>
      <div class="strip-item">
        <div class="strip-label"><span>DECAY</span><span id="disp-decay">1.0x</span></div>
        <input type="range" id="param-decay" min="0.2" max="2.5" value="1.0" step="0.1" oninput="setParam('decay', this.value)">
      </div>
      <div class="strip-item">
        <div class="strip-label"><span>DRIVE</span><span id="disp-drive">0%</span></div>
        <input type="range" id="param-drive" min="0" max="100" value="0" step="5" oninput="setParam('drive', this.value)">
      </div>
    </div>

    <!-- Siatka 16 kroków -->
    <div class="steps-grid" id="steps-container"></div>
  </div>

  <div class="preset-section">
    <button onclick="exportJSON()">Eksportuj Preset (JSON)</button>
    <input type="file" id="import-file" onchange="importJSON(event)" accept=".json" style="display:none">
    <button onclick="document.getElementById('import-file').click()">Importuj JSON</button>
  </div>
</div>

<script>
  let audioCtx;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.body.addEventListener('click', initAudio, { once: true });

  let player;
  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('yt-player', {
      height: '360', width: '640', videoId: 'M7lc1UVf-VE',
      playerVars: { 'playsinline': 1, 'enablejsapi': 1, 'rel': 0, 'disablekb': 1 },
      events: { 'onReady': () => setupDefaultTriggers() }
    });
  };

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  let triggers = Array(10).fill(0);

  function setupDefaultTriggers() {
    const duration = player && player.getDuration ? player.getDuration() : 100;
    for(let i = 0; i < 10; i++) {
      triggers[i] = Math.floor((duration / 10) * (i === 0 ? 0 : i));
    }
    renderTriggers();
  }

  function renderTriggers() {
    const container = document.getElementById('triggers-container');
    if (!container) return;
    container.innerHTML = '';
    const keys = ['1','2','3','4','5','6','7','8','9','0'];
    keys.forEach((key, idx) => {
      container.innerHTML += `
        <div class="trigger-card">
          <label>[ ${key} ]</label>
          <input type="number" id="trig-${idx}" value="${triggers[idx]}" onchange="triggers[${idx}] = parseFloat(this.value)">
          <button onclick="grabTime(${idx})">Grab Time</button>
        </div>`;
    });
  }

  function grabTime(idx) {
    if(player && player.getCurrentTime) {
      const time = Math.floor(player.getCurrentTime());
      triggers[idx] = time;
      document.getElementById(`trig-${idx}`).value = time;
    }
  }

  window.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    initAudio();
    const keyMap = {'1':0, '2':1, '3':2, '4':3, '5':4, '6':5, '7':6, '8':7, '9':8, '0':9};
    if (keyMap[e.key] !== undefined) {
      e.preventDefault();
      const time = triggers[keyMap[e.key]];
      if(player && player.seekTo) {
        player.seekTo(time, true);
        player.playVideo();
      }
    }
  });

  function loadVideo() {
    const url = document.getElementById('yt-url').value;
    const match = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*)/);
    if (match && match[1].length === 11) {
      player.loadVideoById(match[1]);
      setTimeout(setupDefaultTriggers, 1200);
    } else {
      alert("Niepoprawny link YouTube!");
    }
  }

  // --- PARAMETRY ŚCIEŻEK & KOREKCJA DŹWIĘKU ---
  const tracks = ['kick','snare','hihat','lowtom','midtom','hightom','crash','ride','shaker','clap'];
  let pattern = {};
  let trackParams = {};

  tracks.forEach(t => {
    pattern[t] = Array(16).fill(false);
    trackParams[t] = {
      tune: 0,
      cutoff: 20000,
      res: 0,
      decay: 1.0,
      drive: 0
    };
  });

  let isPlaying = false, currentStep = 0, bpm = 124, intervalId = null;

  function onInstrumentChange() {
    const inst = document.getElementById('inst-select').value;
    const p = trackParams[inst];

    document.getElementById('param-tune').value = p.tune;
    document.getElementById('disp-tune').innerText = (p.tune > 0 ? `+${p.tune}` : p.tune) + ' st';

    document.getElementById('param-cutoff').value = p.cutoff;
    document.getElementById('disp-cutoff').innerText = p.cutoff >= 1000 ? (p.cutoff / 1000).toFixed(1) + ' kHz' : p.cutoff + ' Hz';

    document.getElementById('param-res').value = p.res;
    document.getElementById('disp-res').innerText = parseFloat(p.res).toFixed(1);

    document.getElementById('param-decay').value = p.decay;
    document.getElementById('disp-decay').innerText = parseFloat(p.decay).toFixed(1) + 'x';

    document.getElementById('param-drive').value = p.drive;
    document.getElementById('disp-drive').innerText = p.drive + '%';

    renderSteps();
  }

  function setParam(param, val) {
    const inst = document.getElementById('inst-select').value;
    trackParams[inst][param] = parseFloat(val);

    if(param === 'tune') document.getElementById('disp-tune').innerText = (val > 0 ? `+${val}` : val) + ' st';
    if(param === 'cutoff') document.getElementById('disp-cutoff').innerText = val >= 1000 ? (val / 1000).toFixed(1) + ' kHz' : val + ' Hz';
    if(param === 'res') document.getElementById('disp-res').innerText = parseFloat(val).toFixed(1);
    if(param === 'decay') document.getElementById('disp-decay').innerText = parseFloat(val).toFixed(1) + 'x';
    if(param === 'drive') document.getElementById('disp-drive').innerText = val + '%';

    playSound(inst);
  }

  // Renderowanie siatki z podziałką po 4
  function renderSteps() {
    const instSelect = document.getElementById('inst-select');
    const container = document.getElementById('steps-container');
    if (!instSelect || !container) return;

    const inst = instSelect.value;
    container.innerHTML = '';
    for(let i = 0; i < 16; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerText = i + 1;
      
      // Podział po 4: 0..3 (A), 4..7 (B), 8..11 (A), 12..15 (B)
      const isGroupB = Math.floor(i / 4) % 2 === 1;
      const groupClass = isGroupB ? 'step-group-b' : 'step-group-a';
      
      btn.className = `step-btn ${groupClass} ${pattern[inst][i] ? 'active' : ''} ${currentStep === i && isPlaying ? 'current' : ''}`;
      btn.onclick = () => {
        pattern[inst][i] = !pattern[inst][i];
        if (pattern[inst][i]) playSound(inst);
        renderSteps();
      };
      container.appendChild(btn);
    }
  }

  function toggleSequencer() {
    initAudio();
    isPlaying = !isPlaying;
    const btn = document.getElementById('play-seq-btn');
    btn.innerText = isPlaying ? 'STOP' : 'PLAY';
    btn.style.background = isPlaying ? '#ff3333' : 'var(--orange)';
    if(isPlaying) { currentStep = 0; runSequencer(); } 
    else { clearTimeout(intervalId); renderSteps(); }
  }

  function runSequencer() {
    if(!isPlaying) return;
    tracks.forEach(inst => { if(pattern[inst][currentStep]) playSound(inst); });
    renderSteps();
    currentStep = (currentStep + 1) % 16;
    intervalId = setTimeout(runSequencer, (60 / bpm / 4) * 1000);
  }

  function updateBPM() { bpm = parseInt(document.getElementById('bpm-input').value); }

  function createNoiseBuffer(duration = 0.5) {
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  // Krzywa zniekształceń (Drive / Saturation)
  function makeDistortionCurve(amount) {
    const k = amount * 4;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      const x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  // SYNTEZA DŹWIĘKU + PRZETWARZANIE PRZEZ FILTR I PRZESTER
  function playSound(type) {
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const bank = document.getElementById('bank-select').value;
    const p = trackParams[type];

    const pitchMul = Math.pow(2, p.tune / 12);
    const decayMul = p.decay;

    // Wejściowy węzeł kanału
    const trackInput = audioCtx.createGain();

    // 1. Filtr Cutoff & Resonance
    const lpFilter = audioCtx.createBiquadFilter();
    lpFilter.type = 'lowpass';
    lpFilter.frequency.setValueAtTime(Math.min(20000, p.cutoff), now);
    lpFilter.Q.setValueAtTime(p.res, now);

    // 2. Drive / Nasycenie
    let lastNode = lpFilter;
    if (p.drive > 0) {
      const shaper = audioCtx.createWaveShaper();
      shaper.curve = makeDistortionCurve(p.drive / 100);
      shaper.oversample = '2x';
      lpFilter.connect(shaper);
      lastNode = shaper;
    }

    trackInput.connect(lpFilter);
    lastNode.connect(audioCtx.destination);

    // Generowanie źródła
    if (type === 'kick') {
      if (bank === '808') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(trackInput);
        
        const d = 0.45 * decayMul;
        osc.frequency.setValueAtTime(100 * pitchMul, now);
        osc.frequency.exponentialRampToValueAtTime(28 * pitchMul, now + d);
        gain.gain.setValueAtTime(1.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + d);
        osc.start(now); osc.stop(now + d);
      } else { 
        // Modern Club Kick
        const click = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        click.frequency.setValueAtTime(800 * pitchMul, now);
        click.frequency.exponentialRampToValueAtTime(60 * pitchMul, now + 0.008);
        clickGain.gain.setValueAtTime(0.85, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.008);
        click.connect(clickGain); clickGain.connect(trackInput);
        click.start(now); click.stop(now + 0.008);

        const sub = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        const d = 0.35 * decayMul;
        sub.frequency.setValueAtTime(150 * pitchMul, now);
        sub.frequency.exponentialRampToValueAtTime(45 * pitchMul, now + 0.035);
        sub.frequency.exponentialRampToValueAtTime(26 * pitchMul, now + d);
        subGain.gain.setValueAtTime(1.2, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + d);
        sub.connect(subGain); subGain.connect(trackInput);
        sub.start(now); sub.stop(now + d);
      }
    } 
    else if (type === 'snare') {
      const d = 0.18 * decayMul;
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.connect(oscGain); oscGain.connect(trackInput);

      const baseFreq = bank === '808' ? 160 : 190;
      osc.frequency.setValueAtTime(baseFreq * pitchMul, now);
      osc.frequency.exponentialRampToValueAtTime(70 * pitchMul, now + d * 0.6);
      oscGain.gain.setValueAtTime(0.7, now);
      oscGain.gain.exponentialRampToValueAtTime(0.01, now + d * 0.6);
      osc.start(now); osc.stop(now + d * 0.6);

      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(d);
      const filter = audioCtx.createBiquadFilter();
      filter.type = bank === '808' ? 'bandpass' : 'highpass';
      filter.frequency.value = Math.min(18000, (bank === '808' ? 1200 : 1600) * pitchMul);
      const noiseGain = audioCtx.createGain();
      noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(trackInput);
      noiseGain.gain.setValueAtTime(0.75, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + d);
      noise.start(now);
    } 
    else if (type === 'clap') {
      const delays = bank === '808' ? [0, 0.012, 0.024] : [0, 0.008, 0.016, 0.024];
      delays.forEach(delay => {
        const noise = audioCtx.createBufferSource();
        noise.buffer = createNoiseBuffer(0.03);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = Math.min(18000, 1300 * pitchMul);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.03);
        noise.connect(filter); filter.connect(gain); gain.connect(trackInput);
        noise.start(now + delay);
      });
      const tail = audioCtx.createBufferSource();
      const d = 0.25 * decayMul;
      tail.buffer = createNoiseBuffer(d);
      const tailFilter = audioCtx.createBiquadFilter();
      tailFilter.type = 'highpass'; tailFilter.frequency.value = Math.min(18000, 1000 * pitchMul);
      const tailGain = audioCtx.createGain();
      tailGain.gain.setValueAtTime(0.5, now + 0.025);
      tailGain.gain.exponentialRampToValueAtTime(0.01, now + d);
      tail.connect(tailFilter); tailFilter.connect(tailGain); tailGain.connect(trackInput);
      tail.start(now + 0.025);
    }
    else if (type === 'hihat') {
      const d = (bank === '808' ? 0.06 : 0.04) * decayMul;
      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(d + 0.05);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass'; filter.frequency.value = Math.min(19000, 7500 * pitchMul);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + d);
      noise.connect(filter); filter.connect(gain); gain.connect(trackInput);
      noise.start(now);
    }
    else if (type.includes('tom')) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(trackInput);

      const d = 0.25 * decayMul;
      let startFreq = type === 'lowtom' ? 95 : type === 'midtom' ? 130 : 175;
      osc.frequency.setValueAtTime(startFreq * pitchMul, now);
      osc.frequency.exponentialRampToValueAtTime(30 * pitchMul, now + d);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + d);
      osc.start(now); osc.stop(now + d);
    }
    else { 
      const baseD = type === 'crash' ? 1.2 : type === 'ride' ? 0.6 : 0.15;
      const d = baseD * decayMul;
      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(d);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass'; 
      filter.frequency.value = Math.min(19000, (type === 'shaker' ? 5000 : 3500) * pitchMul);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + d);
      noise.connect(filter); filter.connect(gain); gain.connect(trackInput);
      noise.start(now);
    }
  }

  let tapTimes = [];
  function tapTempo() {
    const now = Date.now();
    tapTimes.push(now);
    if(tapTimes.length > 4) tapTimes.shift();
    if(tapTimes.length > 1) {
      const diffs = [];
      for(let i=1; i<tapTimes.length; i++) diffs.push(tapTimes[i] - tapTimes[i-1]);
      bpm = Math.round(60000 / (diffs.reduce((a,b)=>a+b)/diffs.length));
      document.getElementById('bpm-input').value = bpm;
    }
  }

  function exportJSON() {
    const data = {
      videoId: player && player.getVideoData ? player.getVideoData().video_id : null,
      triggers, pattern, trackParams, bpm, bank: document.getElementById('bank-select').value
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type : 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'yt-sampler-preset.json';
    a.click();
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = JSON.parse(evt.target.result);
      if(data.videoId && player) player.loadVideoById(data.videoId);
      if(data.triggers) { triggers = data.triggers; renderTriggers(); }
      if(data.pattern) pattern = data.pattern;
      if(data.trackParams) trackParams = data.trackParams;
      if(data.bpm) { bpm = data.bpm; document.getElementById('bpm-input').value = bpm; }
      if(data.bank) { document.getElementById('bank-select').value = data.bank; }
      onInstrumentChange();
    };
    reader.readAsText(file);
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderTriggers();
    onInstrumentChange();
  });
</script>
</body>
</html>
